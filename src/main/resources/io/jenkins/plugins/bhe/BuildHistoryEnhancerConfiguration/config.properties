config.displayName=Build History Enhancer
enabled.title=Enhance build history sidebar
enabled.description=When unchecked, no scripts are added and the build history sidebar behaves exactly as stock Jenkins.
pageSize.title=Builds per filtered page
pageSize.description=How many matching builds one page of filtered history shows. Between 5 and 100.
maxScan.title=Maximum builds examined per search
maxScan.description=Upper bound on how many builds a single filtered request may read. Between 50 and 50000. On a job with a very long history, a search that reaches this limit says how many builds it checked and offers to continue into older builds.
