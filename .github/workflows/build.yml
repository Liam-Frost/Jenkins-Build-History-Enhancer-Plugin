# Builds and tests on every push and pull request, and attaches an .hpi to a GitHub release for
# each version tag. This is the CI until the plugin is hosted in jenkinsci; after that ci.jenkins.io
# runs the Jenkinsfile and cd.yaml publishes to the update center.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: "25"
          - os: windows-latest
            java: "21"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The version is computed from the commit count, which needs the full history.
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Keep the plugin
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-history-enhancer-hpi
          path: target/*.hpi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Stamp the tag's version into the plugin, so Jenkins shows it after a manual install.
          mvn -B -ntp -DskipTests "-Dchangelist=${version}" package
          mv target/build-history-enhancer.hpi "target/build-history-enhancer-${version}.hpi"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: target/build-history-enhancer-*.hpi
          generate_release_notes: true
          fail_on_unmatched_files: true
