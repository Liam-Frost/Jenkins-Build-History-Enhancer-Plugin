# Builds and tests on every push and pull request, and attaches an .hpi to a GitHub release for
# each version tag. This is the CI until the plugin is hosted in jenkinsci; after that ci.jenkins.io
# runs the Jenkinsfile and cd.yaml publishes to the update center.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }}, ${{ matrix.os }}${{ matrix.jenkins && format(', Jenkins {0}', matrix.jenkins) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: "25"
          - os: windows-latest
            java: "21"
          # The newest Jenkins with the builds-list API the reuse column uses (see CONTRIBUTING.md).
          - os: ubuntu-latest
            java: "25"
            jenkins: "2.589"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is computed from the commit count, which needs the full history.
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify ${{ matrix.jenkins && format('-Djenkins.version={0}', matrix.jenkins) || '' }}
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}${{ matrix.jenkins && format('-jenkins{0}', matrix.jenkins) || '' }}
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Keep the plugin
        if: matrix.os == 'ubuntu-latest' && !matrix.jenkins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-history-enhancer-hpi
          path: target/*.hpi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Stamp the tag's version into the plugin, so Jenkins shows it after a manual install.
          mvn -B -ntp -DskipTests "-Dchangelist=${version}" package
          mv target/build-history-enhancer.hpi "target/build-history-enhancer-${version}.hpi"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: target/build-history-enhancer-*.hpi
          generate_release_notes: true
          fail_on_unmatched_files: true
