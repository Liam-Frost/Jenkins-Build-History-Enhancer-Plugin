# Publishes to the Jenkins update center once the repository is hosted in jenkinsci.
# Does nothing before that: it needs the MAVEN_USERNAME and MAVEN_TOKEN secrets the hosting team sets up.
# https://www.jenkins.io/doc/developer/publishing/releasing-cd/

name: cd
on:
  workflow_dispatch:
    inputs:
      validate_only:
        required: false
        type: boolean
        description: |
          Run validation with release drafter only
          → Skip the release job
        default: false
  check_run:
    types:
      - completed

permissions:
  checks: read
  contents: write

jobs:
  maven-cd:
    uses: jenkins-infra/github-reusable-workflows/.github/workflows/maven-cd.yml@c2470861b1ad94810dc0d207b011e0b57bb91bbb # v1
    with:
      # The reusable workflow declares this input as a string.
      validate_only: ${{ inputs.validate_only == true && 'true' || 'false' }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
